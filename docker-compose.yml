services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mychat
      POSTGRES_USER: mychat
      POSTGRES_PASSWORD: mychat
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mychat"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  minio:
    profiles: ["object-storage"]
    image: quay.io/minio/minio:RELEASE.2025-09-06T17-38-46Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: mychat-dev
      MINIO_ROOT_PASSWORD: change-me-local-only
    volumes: ["minio_data:/data"]
    ports: ["9000:9000", "9001:9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
  backend:
    image: mychat-backend:local
    build: ./backend
    command: sh -c "python manage.py migrate --noinput && daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    environment: &backend-env
      DJANGO_DEBUG: "${DJANGO_DEBUG:-1}"
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:-local-development-key-change-for-production}"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}"
      CSRF_TRUSTED_ORIGINS: "${CSRF_TRUSTED_ORIGINS:-http://localhost:3100,http://localhost:8000}"
      DATABASE_URL: "postgres://mychat:mychat@postgres:5432/mychat"
      REDIS_URL: "redis://redis:6379/0"
      META_GRAPH_API_VERSION: "${META_GRAPH_API_VERSION:-v23.0}"
      WHATSAPP_ACCESS_TOKEN: "${WHATSAPP_ACCESS_TOKEN:-}"
      WHATSAPP_PHONE_NUMBER_ID: "${WHATSAPP_PHONE_NUMBER_ID:-}"
      WHATSAPP_BUSINESS_ACCOUNT_ID: "${WHATSAPP_BUSINESS_ACCOUNT_ID:-}"
      WHATSAPP_APP_SECRET: "${WHATSAPP_APP_SECRET:-}"
      WHATSAPP_VERIFY_TOKEN: "${WHATSAPP_VERIFY_TOKEN:-}"
    ports: ["8000:8000"]
    volumes: ["media_data:/app/media"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
  worker:
    image: mychat-backend:local
    pull_policy: never
    command: celery -A config worker -l info
    environment: *backend-env
    volumes: ["media_data:/app/media"]
    depends_on:
      backend: { condition: service_healthy }
  scheduler:
    image: mychat-backend:local
    pull_policy: never
    command: celery -A config beat -l info
    environment: *backend-env
    depends_on:
      backend: { condition: service_healthy }
  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/login').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
  gateway:
    image: nginx:1.27-alpine
    ports: ["3100:80"]
    volumes: ["./deploy/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on:
      frontend: { condition: service_healthy }
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/login/"]
      interval: 10s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
  minio_data:
  media_data:
